# Builds the ARGUS desktop installer (ARGUS-Setup.exe) on a Windows runner
# and attaches it to a GitHub Release, so any clone/server can serve the
# download without committing 76 MB binaries to the repository.
#
# Triggers only when files that actually go into the installer change, so
# ordinary UI/API commits do NOT trigger a rebuild.
#
# Produces: ARGUS-Setup.exe (Inno Setup installer containing the PyInstaller
# one-file launcher, which bundles node.exe + API server + web dashboard +
# argus-agent.exe).

name: Build Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - "artifacts/security-engine/**"
      - "scripts/argus-launcher.py"
      - "scripts/build-desktop-app.ps1"
      - "scripts/ARGUS.spec"
      - "scripts/make_icon.py"
      - "scripts/icon/**"
      - "installer/argus-installer.iss"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Enable corepack
        run: corepack enable

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller psutil pywebview

      - name: Build agent exe
        run: |
          Set-Location artifacts/security-engine
          python -m PyInstaller --noconfirm argus-agent.spec

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build web dashboard
        run: pnpm --filter @workspace/argus run build

      - name: Build desktop launcher (PyInstaller ARGUS.exe)
        run: powershell -ExecutionPolicy Bypass -File scripts/build-desktop-app.ps1

      - name: Build installer (Inno Setup ARGUS-Setup.exe)
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue)
          if (!$iscc) { Write-Error "Inno Setup not found" }
          Set-Location installer
          & $iscc.FullName argus-installer.iss

      - name: Verify installer exists
        shell: pwsh
        run: |
          $exe = "dist/installer/ARGUS-Setup.exe"
          if (!(Test-Path $exe)) { Write-Error "ARGUS-Setup.exe was not produced" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "ARGUS-Setup.exe built ($mb MB)"

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ARGUS-Setup
          path: dist/installer/ARGUS-Setup.exe
          if-no-files-found: error

      - name: Attach to rolling "latest" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "installer-latest"
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag dist/installer/ARGUS-Setup.exe `
            --title "ARGUS Desktop Installer (latest)" `
            --notes "Automated build from commit $env:GITHUB_SHA. Download ARGUS-Setup.exe and run it to install ARGUS on Windows."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            artifacts/security-engine/build/**/warn-*.txt
            scripts/build/**/warn-*.txt
          if-no-files-found: ignore
